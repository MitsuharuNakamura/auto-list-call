
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自動架電システム</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="style.css" rel="stylesheet"/>
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4 text-primary">自動架電システム</h1>
    <div class="mb-3">
      <input id="fileInput" type="file" accept=".csv" class="form-control" />
    </div>
    <div id="error" class="alert alert-danger d-none"></div>
    <div id="config" class="mb-3 d-none">
      <div class="row g-3 align-items-center">
        <div class="col-auto">
          <label for="languageSelect" class="col-form-label">言語</label>
        </div>
        <div class="col-auto">
          <select id="languageSelect" class="form-select">
            <option value="ja-JP">日本語</option>
            <option value="en-US">English</option>
          </select>
        </div>
        <div class="col-auto">
          <label for="voiceSelect" class="col-form-label">音声</label>
        </div>
        <div class="col-auto">
          <select id="voiceSelect" class="form-select">
            <option value="woman">女性</option>
            <option value="man">男性</option>
          </select>
        </div>
      </div>
      <div class="mt-3">
        <label for="messageInput" class="form-label">メッセージ</label>
        <textarea id="messageInput" class="form-control" rows="3"></textarea>
      </div>
      <button id="startBtn" class="btn btn-primary mt-3" disabled>自動架電開始</button>
    </div>
    <div id="progress" class="mb-3"></div>
    <table id="callsTable" class="table table-striped d-none">
      <thead class="table-primary">
        <tr>
          <th>#</th>
          <th>名前</th>
          <th>電話番号</th>
          <th>ステータス</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
